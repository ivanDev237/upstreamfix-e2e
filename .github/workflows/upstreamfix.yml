name: UpstreamFix API migrations

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstreamfix.migrate]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  upstreamfix:
    # Workflow and migration tool pinned to the same reviewed commit of ivanDev237/upstreamfix main.
    uses: ivanDev237/upstreamfix/.github/workflows/client-migrations.yml@de19067c03f6af2529bdaf002bf706398075cdff
    with:
      upstreamfix_sha: de19067c03f6af2529bdaf002bf706398075cdff
      ci_workflow: ci.yml
