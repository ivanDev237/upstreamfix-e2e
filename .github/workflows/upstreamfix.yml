name: UpstreamFix API migrations

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstreamfix.migrate, bot-pr-followup]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  upstreamfix:
    # Workflow and migration tool pinned to UpstreamFix v0.4.0 (main eca1cf5).
    uses: ivanDev237/upstreamfix/.github/workflows/client-migrations.yml@56ce4e953dbb2623b24eb781ea536cabe191f67c
    with:
      upstreamfix_sha: 56ce4e953dbb2623b24eb781ea536cabe191f67c
      ci_workflow: ci.yml
