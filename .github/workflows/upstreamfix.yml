name: UpstreamFix API migrations

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstreamfix.migrate, bot-pr-followup]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  upstreamfix:
    # Workflow and migration tool pinned to UpstreamFix v0.4.0 (main eca1cf5).
    uses: ivanDev237/upstreamfix/.github/workflows/client-migrations.yml@0d75ae7c3841a415b1217cada831d96fa3ca43ae
    with:
      upstreamfix_sha: 0d75ae7c3841a415b1217cada831d96fa3ca43ae
      ci_workflow: ci.yml
