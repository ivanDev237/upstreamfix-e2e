name: UpstreamFix API migrations

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstreamfix.migrate]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  upstreamfix:
    # Workflow and migration tool pinned to UpstreamFix v0.4.0 (main eca1cf5).
    uses: ivanDev237/upstreamfix/.github/workflows/client-migrations.yml@eca1cf55717a32bb0dc0374229c9eb62354845f7
    with:
      upstreamfix_sha: eca1cf55717a32bb0dc0374229c9eb62354845f7
      ci_workflow: ci.yml
