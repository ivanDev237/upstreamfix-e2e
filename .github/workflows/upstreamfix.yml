name: UpstreamFix API migrations

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstreamfix.migrate]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  upstreamfix:
    # Workflow from ivanDev237/upstreamfix PR #11 (App dispatch support, not yet on main);
    # the migration tool itself is pinned to a reviewed commit of main.
    uses: ivanDev237/upstreamfix/.github/workflows/client-migrations.yml@7c64a4e05acd154bf990855ede6c1179e80dfe6b
    with:
      upstreamfix_sha: cff770542591226635d1d8a7e9c1766209d30c78
      ci_workflow: ci.yml
